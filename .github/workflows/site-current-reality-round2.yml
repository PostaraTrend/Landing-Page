name: Current reality follow up refresh

on:
  push:
    branches:
      - site-current-reality-2026-10-03
    paths:
      - .github/workflows/site-current-reality-round2.yml

permissions:
  contents: write

jobs:
  refresh-follow-up:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: site-current-reality-2026-10-03
          fetch-depth: 0

      - name: Apply follow up site audit fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Make navigation match the now product-specific publishing section.
          replace_once('index.html', '<a href="#how" class="nk">How It Works</a>', '<a href="#how" class="nk">Autopilot Social</a>')
          replace_once('products.html', '<a href="index.html#how" class="nk">How It Works</a>', '<a href="index.html#how" class="nk">Autopilot Social</a>')

          # Learn page: fix a broken relative Products link and align organization schema/navigation.
          replace_once('learn/index.html',
              '"description":"Autonomous, AI-powered social media content publishing and trend-intelligence tools for small and medium businesses."',
              '"description":"AI products for governed automation, market intelligence and evidence backed career and hiring workflows."')
          replace_once('learn/index.html', '<a href="products.html" class="nk">Products</a>', '<a href="/products.html" class="nk">Products</a>')
          replace_once('learn/index.html', '<a href="/#how" class="nk">How It Works</a>', '<a href="/#how" class="nk">Autopilot Social</a>')

          # Legacy walkthrough remains useful, but remove old RoleScout branding and old preview hostname.
          p = Path('rolescout/demo.html')
          text = p.read_text(encoding='utf-8')
          if 'rolescout-postaratrend.lovable.app' not in text:
              raise SystemExit('rolescout/demo.html: expected legacy hostname not found')
          text = text.replace('rolescout-postaratrend.lovable.app', 'tracescout.app')
          if '<div class="brand">Role<span>Scout</span></div>' not in text:
              raise SystemExit('rolescout/demo.html: expected RoleScout brand not found')
          text = text.replace('<div class="brand">Role<span>Scout</span></div>', '<div class="brand">Trace<span>Scout</span></div>', 1)
          text = text.replace('Free forever', 'Free')
          text = text.replace('Creating an account is free, permanently.', 'Creating an account is free.')
          text = text.replace('No other resume tool has anything to point to here.', 'The employer can inspect the evidence behind the claims instead of relying on a generated document alone.')
          p.write_text(text, encoding='utf-8')

          # Sitemap: refresh core lastmod dates and remove three URLs that are now redirects.
          p = Path('sitemap.xml')
          text = p.read_text(encoding='utf-8')
          for old, new in [
              ('https://postaratrend.ca/</loc><lastmod>2026-07-22', 'https://postaratrend.ca/</loc><lastmod>2026-10-03'),
              ('https://postaratrend.ca/products.html</loc><lastmod>2026-07-22', 'https://postaratrend.ca/products.html</loc><lastmod>2026-10-03'),
              ('https://postaratrend.ca/releases/</loc><lastmod>2026-07-27', 'https://postaratrend.ca/releases/</loc><lastmod>2026-10-03'),
              ('https://postaratrend.ca/learn/</loc><lastmod>2026-09-03', 'https://postaratrend.ca/learn/</loc><lastmod>2026-10-03'),
          ]:
              if old not in text:
                  raise SystemExit(f'sitemap.xml: expected date entry missing: {old}')
              text = text.replace(old, new, 1)
          for stale in [
              '  <url><loc>https://postaratrend.ca/rolescout/</loc><lastmod>2026-07-29</lastmod><priority>0.9</priority></url>\n',
              '  <url><loc>https://postaratrend.ca/rolescout/verified.html</loc><lastmod>2026-08-26</lastmod><priority>0.8</priority></url>\n',
              '  <url><loc>https://postaratrend.ca/rolescout/overview.html</loc><lastmod>2026-08-27</lastmod><priority>0.7</priority></url>\n',
          ]:
              if stale not in text:
                  raise SystemExit(f'sitemap.xml: redirect entry missing: {stale.strip()}')
              text = text.replace(stale, '', 1)
          demo_entry = '  <url><loc>https://postaratrend.ca/rolescout/demo.html</loc><lastmod>2026-10-03</lastmod><priority>0.6</priority></url>\n'
          anchor = '  <url><loc>https://postaratrend.ca/rolescout/rolescout-jobs.html</loc><lastmod>2026-08-27</lastmod><priority>0.6</priority></url>\n'
          if demo_entry not in text:
              if anchor not in text:
                  raise SystemExit('sitemap.xml: rolescout jobs anchor missing')
              text = text.replace(anchor, demo_entry + anchor, 1)
          p.write_text(text, encoding='utf-8')

          # Assertions from the audit.
          assertions = {
              'index.html': ['Autopilot Social</a>', 'AI products for growth, hiring and trusted automation.'],
              'products.html': ['<h3>TraceScout</h3>', '<h3>Autopilot Social</h3>'],
              'learn/index.html': ['href="/products.html" class="nk">Products</a>', 'Autopilot Social</a>'],
              'rolescout/demo.html': ['<div class="brand">Trace<span>Scout</span></div>', 'tracescout.app/auth'],
              'sitemap.xml': ['rolescout/demo.html', '2026-10-03'],
          }
          for path, phrases in assertions.items():
              text = Path(path).read_text(encoding='utf-8')
              for phrase in phrases:
                  if phrase not in text:
                      raise SystemExit(f'{path}: required phrase missing: {phrase}')

          # Stale items should be gone from the files we changed.
          if 'Role<span>Scout</span>' in Path('rolescout/demo.html').read_text(encoding='utf-8'):
              raise SystemExit('rolescout/demo.html: legacy visible brand remains')
          if 'Free forever' in Path('rolescout/demo.html').read_text(encoding='utf-8'):
              raise SystemExit('rolescout/demo.html: Free forever remains')
          if 'href="products.html" class="nk">Products</a>' in Path('learn/index.html').read_text(encoding='utf-8'):
              raise SystemExit('learn/index.html: broken relative Products link remains')
          PY

      - name: Validate static files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in [Path('index.html'), Path('products.html'), Path('learn/index.html'), Path('rolescout/demo.html')]:
              t = f.read_text(encoding='utf-8')
              if '<html' not in t or '</html>' not in t or '<body' not in t or '</body>' not in t:
                  raise SystemExit(f'{f}: basic HTML markers missing')
              print(f'{f}: OK')
          s = Path('sitemap.xml').read_text(encoding='utf-8')
          if '<urlset' not in s or '</urlset>' not in s:
              raise SystemExit('sitemap.xml: urlset markers missing')
          print('sitemap.xml: OK')
          PY
          git diff --check

      - name: Commit follow up audit fixes and remove workflow
        shell: bash
        run: |
          rm .github/workflows/site-current-reality-round2.yml
          git config user.name "PostaraTrend Site Refresh"
          git config user.email "admin@postaratrend.ca"
          git add index.html products.html learn/index.html rolescout/demo.html sitemap.xml .github/workflows/site-current-reality-round2.yml
          git commit -m "Complete current reality site audit fixes"
          git push origin HEAD:site-current-reality-2026-10-03

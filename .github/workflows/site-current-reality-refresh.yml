name: One time current reality refresh

on:
  push:
    branches:
      - site-current-reality-2026-10-03
    paths:
      - .github/workflows/site-current-reality-refresh.yml

permissions:
  contents: write

jobs:
  refresh-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: site-current-reality-2026-10-03
          fetch-depth: 0

      - name: Refresh public positioning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Homepage SEO and corporate positioning
          replace_once("index.html",
              "<title>PostaraTrend Technologies — Trend Intelligence for the Digital Age</title>",
              "<title>PostaraTrend Technologies | AI Products for Growth, Hiring and Trusted Automation</title>")
          replace_once("index.html",
              '<meta name="description" content="PostaraTrend Technologies Inc. is an Alberta-incorporated technology company that runs autonomous, AI-powered publishing and trend intelligence for small and medium businesses.">',
              '<meta name="description" content="PostaraTrend Technologies Inc. is an Alberta technology company building and operating AI products for governed automation, market intelligence and evidence backed hiring through TraceScout.">')
          replace_once("index.html",
              '<meta property="og:title" content="PostaraTrend Technologies — Trend Intelligence for the Digital Age">',
              '<meta property="og:title" content="PostaraTrend Technologies | AI Products for Growth, Hiring and Trusted Automation">')
          replace_once("index.html",
              '<meta property="og:description" content="An Alberta technology company building AI-powered content automation and trend intelligence for small and medium businesses.">',
              '<meta property="og:description" content="An Alberta technology company operating AI products for governed automation, market intelligence and evidence backed career and hiring workflows.">')
          replace_once("index.html",
              '"description":"Autonomous, AI-powered social media content publishing and trend-intelligence tools for small and medium businesses."',
              '"description":"AI products for governed automation, market intelligence and evidence backed career and hiring workflows."')

          # Hero
          replace_once("index.html",
              '<p class="htl">Turn trends into brand-ready content, automatically.</p>',
              '<p class="htl">AI products for growth, hiring and trusted automation.</p>')
          replace_once("index.html",
              '<p class="hsub">We are an Alberta technology company building AI that detects emerging trends and turns them into brand-safe content, so small and medium businesses stay visible without a content team. Our products are live today and our autonomous publishing platform is running in production, publishing to real pages on a daily schedule. We also built TraceScout, a resume matching and interview preparation app for job seekers, live today at tracescout.ca.</p>',
              '<p class="hsub">PostaraTrend Technologies Inc. is an Alberta technology company building and operating AI systems that move real work forward. Our governed publishing platform runs in production, our intelligence engines monitor markets and opportunities, and TraceScout connects job seekers, hiring teams and recruiting agencies through evidence backed matching, verified career data and structured hiring workflows.</p>')
          replace_once("index.html", 'See What Is Live <span class="ba">&rarr;</span>', 'Explore What Is Live <span class="ba">&rarr;</span>')

          # What We Do
          replace_once("index.html",
              '<p>PostaraTrend combines real-time data, AI-powered content workflows, and strategic analytics into a single platform.</p>',
              '<p>PostaraTrend combines governed automation, market intelligence and evidence grounded workflows across products that are already running in production.</p>')
          replace_once("index.html",
              '<h3>Trend Intelligence</h3><p>Real-time detection of cultural and commercial trends across social media, news, search, and public data — so you see what is rising before it peaks.</p>',
              '<h3>Market and Opportunity Intelligence</h3><p>We monitor public data, market signals and trigger events so businesses can see what is changing and where a useful opportunity is opening.</p>')
          replace_once("index.html",
              '<h3>Content Automation</h3><p>AI-powered content creation, scheduling, and publishing workflows that reduce manual social media management and keep your brand consistently visible.</p>',
              '<h3>Governed Automation</h3><p>AI systems create, review and publish with brand rules, evidence checks and refusal logging built into the workflow before anything ships.</p>')
          replace_once("index.html",
              '<h3>Strategic Insights</h3><p>Performance analytics and market intelligence that help you understand what is working, what is emerging, and where to invest your attention next.</p>',
              '<h3>Career and Hiring Intelligence</h3><p>TraceScout gives job seekers, hiring teams and recruiting agencies evidence backed matching, verified career data and structured workflows from resume to interview.</p>')

          # Frame the publishing pipeline as one product lane, not the whole company
          replace_once("index.html", '<div class="pipe-eyebrow">Your social presence, on autopilot</div>', '<div class="pipe-eyebrow">Autopilot Social</div>')
          replace_once("index.html",
              '<h2 class="pipe-title">From your brand to published posts, <span class="pipe-nb">without you lifting a finger</span></h2>',
              '<h2 class="pipe-title">From brand rules to published content, <span class="pipe-nb">with governance built in</span></h2>')
          replace_once("index.html",
              '<span class="pipe-dist-note">Live on Facebook and Instagram today, with LinkedIn and Google Business Profile in progress on the same engine.</span>',
              '<span class="pipe-dist-note">Live on Facebook and Instagram today. Additional channels use the same governed publishing engine as they are enabled.</span>')
          replace_once("index.html",
              '<div class="pipe-foot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg> Every day, on its own. No dashboards to learn.</div>',
              '<div class="pipe-foot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg> Runs on schedule, with every published and refused decision recorded.</div>')
          replace_once("index.html",
              '<div class="pipe-cta-row"><a class="btn bp" href="products.html" style="display:inline-flex;font-size:16px;padding:17px 38px;border-radius:12px">Explore the digital products <span class="ba">&rarr;</span></a></div>',
              '<div class="pipe-cta-row"><a class="btn bp" href="#services" style="display:inline-flex;font-size:16px;padding:17px 38px;border-radius:12px">See Autopilot Social plans <span class="ba">&rarr;</span></a></div>')

          # About
          replace_once("index.html",
              '<p>PostaraTrend was born from a simple observation: brands and agencies are always one step behind the trend curve — reacting to what has already peaked instead of predicting what is about to rise.</p>',
              '<p>PostaraTrend was built around a practical idea: AI should not simply generate output. It should carry evidence, rules and accountability into the work it performs.</p>')
          replace_once("index.html",
              '<p>Our founding team spent over a decade building enterprise-grade technology systems at some of Canada\'s largest organisations. We took that same discipline — systematic, measurable, built to operate at scale — and applied it to a problem that affects every brand in the market: staying ahead of trends and turning them into content, fast.</p>',
              '<p>Our founding team brings more than a decade of enterprise systems and operations experience. We apply that discipline across governed publishing, market and opportunity intelligence, and TraceScout, our evidence backed career and hiring platform for job seekers, employers and recruiting agencies.</p>')
          replace_once("index.html", '<h4>Always On</h4><p>Continuous trend monitoring and automated publishing designed to keep your brand consistently visible.</p>', '<h4>Governed by Design</h4><p>Rules, evidence checks and refusal paths are built into the workflow so automation can be inspected and trusted.</p>')
          replace_once("index.html", '<h4>AI Native</h4><p>Intelligence is the product, not a feature. Every decision in the pipeline is AI-informed.</p>', '<h4>AI Native</h4><p>Intelligence is built into products and workflows from the start, rather than added as a surface feature.</p>')

          # How it works section is specifically Autopilot Social
          replace_once("index.html", '<div class="sl">How It Works</div>', '<div class="sl">How Autopilot Social Works</div>')
          replace_once("index.html", '<h2>From trend to published content — <span class="gu">automatically</span>.</h2>', '<h2>From signal to reviewed publication, <span class="gu">automatically</span>.</h2>')
          replace_once("index.html", '<p>PostaraTrend runs a continuous intelligence-to-publishing pipeline with quality review built in at every stage.</p>', '<p>This is the operating flow behind our governed publishing service. TraceScout has its own evidence and hiring workflow.</p>')
          replace_once("index.html",
              '<div class="step"><div class="step-num">1</div><h3>Detect</h3><div class="step-sub">Trend Intelligence</div><p>The platform continuously monitors social media, news, search trends, and public data to identify cultural and commercial trends as they emerge — before they peak.</p></div>',
              '<div class="step"><div class="step-num">1</div><h3>Detect</h3><div class="step-sub">Trend Intelligence</div><p>The platform monitors social media, news, search trends and public data to identify relevant cultural and commercial signals as they emerge.</p></div>')
          replace_once("index.html",
              '<div class="step"><div class="step-num">2</div><h3>Create</h3><div class="step-sub">AI Content Generation</div><p>Detected trends are transformed into branded content — captions, graphics, and video — tailored to your brand voice, audience, and platform requirements, with automated quality checks before anything ships.</p></div>',
              '<div class="step"><div class="step-num">2</div><h3>Create</h3><div class="step-sub">AI Content Generation</div><p>Relevant signals are turned into branded captions, graphics and video, then checked against configured brand, grounding and sensitivity rules before anything can ship.</p></div>')
          replace_once("index.html",
              '<div class="step"><div class="step-num">3</div><h3>Publish</h3><div class="step-sub">Reviewed Distribution</div><p>Approved content is published directly to your Facebook and Instagram pages on a planned schedule. Performance data feeds back into the system to improve future output.</p></div>',
              '<div class="step"><div class="step-num">3</div><h3>Publish</h3><div class="step-sub">Reviewed Distribution</div><p>Approved content is published to enabled channels on schedule. Refused items are logged with the reason, and performance data feeds the next cycle.</p></div>')
          replace_once("index.html", '<div class="sc"><div class="sc-n">SMB</div><div class="sc-l">Built for small business</div></div>', '<div class="sc"><div class="sc-n">LOG</div><div class="sc-l">Published and refused decisions recorded</div></div>')

          # Who We Serve
          replace_once("index.html", '<h2>Built for teams that cannot afford to <span class="gu">fall behind</span>.</h2>', '<h2>Built for people and organisations that need <span class="gu">trusted AI</span>.</h2>')
          replace_once("index.html", '<p>Brands, creators, agencies, and organisations that need to stay visible and relevant across social channels without building a full in-house content operation.</p>', '<p>PostaraTrend serves businesses that need governed automation, job seekers who want truthful career tools, hiring teams evaluating evidence, and recruiting agencies managing candidates and clients.</p>')
          replace_once("index.html", '<h3>Brands and Retailers</h3><p>Local and online businesses that need consistent, on-trend content without hiring an in-house team.</p>', '<h3>Businesses and Brands</h3><p>Teams that need governed publishing, market intelligence or opportunity scouting without building a large internal operation.</p>')
          replace_once("index.html", '<h3>Content Creators</h3><p>Individuals building an audience who want trend-aware posts without spending hours on research.</p>', '<h3>Job Seekers</h3><p>People who want honest role matching, evidence backed application materials, application tracking and interview preparation without invented experience.</p>')
          replace_once("index.html", '<h3>Marketing Agencies</h3><p>Agencies managing multiple client accounts who need a scalable, quality-gated content pipeline.</p>', '<h3>Recruiting Agencies</h3><p>Agencies that need structured client, job order and candidate workflows with evidence backed matching and verification analytics.</p>')
          replace_once("index.html", '<h3>Organisations</h3><p>Larger teams that need governed, brand-safe publishing at scale, with clear approval rules.</p>', '<h3>Hiring Teams</h3><p>Employers that need a structured workspace for jobs, candidates, evidence backed matches, interviews and hiring decisions.</p>')

          # FAQ
          replace_once("index.html",
              '<details class="faq"><summary>What can I use today?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Our YYC Rental Studio product line is live now — a set of digital tools for Alberta landlords, available through our shop. Our autonomous publishing platform is live and running in production. Managed plans are open now, and founding clients receive forty percent off the first six months in exchange for a review we may publish.</div></details>',
              '<details class="faq"><summary>What can I use today?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">TraceScout is live for job seekers, hiring teams and recruiting agencies. Autopilot Social is live in production for governed publishing. Our market and opportunity intelligence services are operating, and our PostaraTrend Guides and YYC Rental Studio digital products are available now.</div></details>')
          replace_once("index.html",
              '<details class="faq"><summary>Who is the platform for?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Brands, creators, agencies, and organisations that need to stay visible and relevant across social channels without building a full in-house content operation. If your team is always racing to catch up with trends, PostaraTrend is built for you.</div></details>',
              '<details class="faq"><summary>Who does PostaraTrend serve?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">We serve businesses that need governed automation and market intelligence, job seekers using TraceScout, hiring teams evaluating candidates, and recruiting agencies managing jobs, clients and candidate workflows.</div></details>')
          replace_once("index.html",
              '<details class="faq"><summary>How is this different from a social scheduler?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Schedulers post what you give them. PostaraTrend detects emerging trends, generates brand-safe content around them, runs that content through automated quality checks, and publishes on a planned schedule — closing the loop from intelligence to output.</div></details>',
              '<details class="faq"><summary>How is Autopilot Social different from a social scheduler?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Schedulers post what you give them. Autopilot Social finds relevant signals, creates branded content, checks it against configured rules, records refusals and publishes approved items on schedule.</div></details>')
          insert_after = '<details class="faq"><summary>How is Autopilot Social different from a social scheduler?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Schedulers post what you give them. Autopilot Social finds relevant signals, creates branded content, checks it against configured rules, records refusals and publishes approved items on schedule.</div></details>'
          trace_faq = '<details class="faq"><summary>How is TraceScout different from a typical AI resume tool?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">TraceScout starts with attested source evidence. Tailored resumes, cover letters, interview preparation and hiring views trace back to that evidence, and unsupported claims are refused rather than invented. It also includes dedicated workspaces for hiring teams and recruiting agencies.</div></details>'
          replace_once("index.html", insert_after, insert_after + '\n' + trace_faq)
          replace_once("index.html",
              '<details class="faq"><summary>Will I have control over what gets published?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Yes. You define your brand voice, approval rules, and publishing cadence. The platform can run in fully automated mode, human-in-the-loop review mode, or anywhere in between — depending on your governance requirements.</div></details>',
              '<details class="faq"><summary>Will I have control over what gets published?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Yes. You define your brand voice, approval rules and publishing cadence. Autopilot Social can run fully autonomously or with human review, depending on your governance requirements.</div></details>')
          replace_once("index.html",
              '<details class="faq"><summary>How do I get started?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Contact us through the form below or email inquiries@postaratrend.ca. We will walk you through the products live today, help you pick the right plan, and get your first content or TraceScout account running within days.</div></details>',
              '<details class="faq"><summary>How do I get started?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">You can open TraceScout directly at tracescout.ca. For Autopilot Social, market intelligence, opportunity scouting, partnerships or other PostaraTrend services, use the contact form below or email inquiries@postaratrend.ca.</div></details>')
          replace_once("index.html",
              '<details class="faq"><summary>Are you open to partnerships and investment?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Yes — we are in conversation with agencies exploring white-label arrangements and with investors interested in the content intelligence category. Use the contact form below and we will set up a call.</div></details>',
              '<details class="faq"><summary>Are you open to partnerships and investment?<span class="faq-ic" aria-hidden="true">+</span></summary><div class="faq-a">Yes. We are open to commercial partnerships, workforce and agency collaborations, channel relationships and investment conversations across governed automation, hiring infrastructure and market intelligence.</div></details>')

          # Contact and footer
          replace_once("index.html", '<h2>Let\'s <span class="gu">connect</span>.</h2>', '<h2>Connect <span class="gu">with us</span>.</h2>')
          replace_once("index.html", '<p>Whether you are a brand looking for trend intelligence, an agency interested in partnership, or an investor exploring opportunities — we would love to hear from you.</p>', '<p>Whether you are exploring TraceScout, governed publishing, market intelligence, an agency or workforce partnership, or an investment conversation, we would be glad to hear from you.</p>')
          replace_once("index.html", '<option value="Product Demo">Product Demo</option>', '<option value="TraceScout">TraceScout</option>\n<option value="Product Demo">Product Demo</option>')
          replace_once("index.html", '<p>Trend intelligence for the digital age. We help brands, creators, and organisations identify and act on cultural and commercial trends before the competition does.</p>', '<p>PostaraTrend Technologies builds and operates AI products for governed automation, market intelligence and evidence backed career and hiring workflows.</p>')
          replace_once("index.html", '<a href="#how">How It Works</a>', '<a href="#how">Autopilot Social</a>')

          # Products page positioning
          replace_once("products.html", '<title>Digital Products — PostaraTrend Technologies</title>', '<title>Products | PostaraTrend Technologies</title>')
          replace_once("products.html",
              '<meta name="description" content="PostaraTrend Technologies Inc. is an Alberta-incorporated technology company building autonomous, AI-powered content and trend-intelligence tools for small and medium businesses.">',
              '<meta name="description" content="Explore live PostaraTrend products, including TraceScout, Autopilot Social, practical business guides and YYC Rental Studio tools.">')
          replace_once("products.html", '<meta property="og:title" content="Digital Products — PostaraTrend Technologies">', '<meta property="og:title" content="Products | PostaraTrend Technologies">')
          replace_once("products.html", '<meta property="og:description" content="An Alberta technology company building AI-powered content automation and trend intelligence for small and medium businesses.">', '<meta property="og:description" content="Live PostaraTrend products for career and hiring intelligence, governed automation, market intelligence and practical business operations.">')
          replace_once("products.html",
              '"description":"Autonomous, AI-powered social media content publishing and trend-intelligence tools for small and medium businesses."',
              '"description":"AI products for governed automation, market intelligence and evidence backed career and hiring workflows."')
          replace_once("products.html",
              '<p>PostaraTrend operates a growing portfolio of digital products for small and medium businesses. Our first product line is shipping now, with our autonomous publishing platform in active development.</p>',
              '<p>PostaraTrend operates a growing portfolio of live products for career and hiring intelligence, governed automation, market intelligence and practical business operations. The products listed here are available now.</p>')

          auto_marker = '''<div class="dev-card">\n<span class="prod-status live"><span class="pd"></span>Live</span>\n<h3>Autonomous Publishing Platform</h3>'''
          trace_card = '''<div class="dev-card">\n<span class="prod-status live"><span class="pd"></span>Live</span>\n<h3>TraceScout</h3>\n<div class="prod-tag">Evidence backed career and hiring intelligence</div>\n<p>TraceScout serves job seekers, hiring teams and recruiting agencies in one evidence grounded system. It starts with attested career data, matches that evidence against real roles, builds truthful application materials, tracks applications and supports interview preparation without inventing unsupported experience.</p>\n<ul class="dev-feats">\n<li>Attested resumes with line level provenance</li>\n<li>Evidence backed job matching and tailored application materials</li>\n<li>Application tracking, interview preparation and 30 60 90 plans</li>\n<li>Hiring and agency workspaces with verification analytics</li>\n</ul>\n<a class="prod-cta" href="https://tracescout.ca/">Explore TraceScout <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>\n</div>\n<div style="margin-bottom:24px"></div>\n''' + auto_marker
          replace_once("products.html", auto_marker, trace_card)
          replace_once("products.html", '<h3>Autonomous Publishing Platform</h3>', '<h3>Autopilot Social</h3>')
          replace_once("products.html", '<div class="prod-tag">Trend-to-content automation</div>', '<div class="prod-tag">Governed autonomous publishing</div>')
          replace_once("products.html", '<p>Our flagship platform detects emerging trends and turns them into brand-safe content, with built-in quality review before anything is published. Live and running in production today, publishing to real pages on a daily schedule.</p>', '<p>Autopilot Social detects relevant signals, creates branded content, checks each item against configured rules, records refusals and publishes approved work to enabled channels on schedule.</p>')
          replace_once("products.html", '<p class="prod-note" style="margin-top:28px">Both product lines are operated by PostaraTrend Technologies Inc. as part of our small-business digital portfolio. New tools are added as they are built and tested.</p>', '<p class="prod-note" style="margin-top:28px">TraceScout, Autopilot Social, PostaraTrend Guides and YYC Rental Studio are operated by PostaraTrend Technologies Inc. New products are added after they have been built, tested and made live.</p>')
          replace_once("products.html", '<p>Trend intelligence for the digital age. We help brands, creators, and organisations identify and act on cultural and commercial trends before the competition does.</p>', '<p>PostaraTrend Technologies builds and operates AI products for governed automation, market intelligence and evidence backed career and hiring workflows.</p>')

          # Releases page, keep current release inventory but bring TraceScout up to the current product scope
          replace_once("releases/index.html",
              '<p>No roadmap items and no concepts. These are the products and services PostaraTrend operates today, publishing, prospecting, and analyzing on live systems. Where a demo exists, you can open it and see the work.</p>',
              '<p>No roadmap items and no concepts. These are the products and services PostaraTrend operates today across publishing, prospecting, analysis, career matching and hiring workflows on live systems. Where a demo exists, you can open it and see the work.</p>')
          replace_once("releases/index.html", '<div class="relkick">VERIFIED JOB APPLICATIONS</div>', '<div class="relkick">EVIDENCE BACKED CAREER AND HIRING</div>')
          replace_once("releases/index.html",
              '<p class="relbody">The honest way from resume to interview room. TraceScout transcribes a resume verbatim, has the seeker attest every line, matches it honestly against real open postings in the seeker’s country, and drafts tailored resumes and verified cover letters where every line traces to attested content. Anything unsupported is refused and logged, and an employer can open a live verification link to check the claim. When an application reaches the interview stage, TraceScout builds a preparation pack for that exact role, grounded in what the seeker attested and honest about the gaps, and a practice mode checks every answer the seeker writes or speaks against that attested resume, sentence by sentence. Once the interview is set, TraceScout writes a 30 60 90 day plan for that exact role, every action tied to the posting and to an attested fact, ready to present and to edit in PDF and Word.</p>',
              '<p class="relbody">TraceScout is PostaraTrend\'s evidence backed career and hiring platform for job seekers, employers and recruiting agencies. A seeker attests the source resume, TraceScout scores real roles against that evidence, produces tailored materials without inventing unsupported experience, and records refusals when a claim cannot be supported. The seeker workspace continues through application tracking, interview preparation, practice and a role specific 30 60 90 plan. Hiring teams and agencies use dedicated workspaces for jobs, candidates, evidence backed matching, collaboration, client workflows and verification analytics.</p>')
          old_chips = '''<div class="chips">\n          <span class="chip">Attested source lines</span>\n          <span class="chip">Honest match scores</span>\n          <span class="chip">Verified cover letters</span>\n          <span class="chip">Interview preparation packs</span>\n          <span class="chip">Practice mode</span>\n          <span class="chip">30 60 90 day plan</span>\n          <span class="chip">Refusal ledger</span>\n          <span class="chip">Live verification link</span>\n        </div>'''
          new_chips = '''<div class="chips">\n          <span class="chip">Attested source lines</span>\n          <span class="chip">Line level provenance</span>\n          <span class="chip">Honest match scores</span>\n          <span class="chip">Application command centre</span>\n          <span class="chip">Interview preparation</span>\n          <span class="chip">30 60 90 day plan</span>\n          <span class="chip">Hiring workspace</span>\n          <span class="chip">Agency workspace</span>\n          <span class="chip">Verification analytics</span>\n          <span class="chip">Refusal ledger</span>\n          <span class="chip">Live verification link</span>\n        </div>'''
          replace_once("releases/index.html", old_chips, new_chips)

          # Basic assertions against the stale public messages this refresh is meant to remove
          checks = {
              "index.html": [
                  "resume matching and interview preparation app for job seekers",
                  "Turn trends into brand-ready content, automatically.",
                  "Who is the platform for?",
              ],
              "products.html": [
                  "autonomous publishing platform in active development",
                  "Both product lines are operated",
                  "<h3>Autonomous Publishing Platform</h3>",
              ],
              "releases/index.html": [
                  "VERIFIED JOB APPLICATIONS",
              ],
          }
          for path, stale in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for phrase in stale:
                  if phrase in text:
                      raise SystemExit(f"{path}: stale phrase remains: {phrase}")

          # Verify key new positioning is present
          required = {
              "index.html": ["AI products for growth, hiring and trusted automation.", "Career and Hiring Intelligence", "Job Seekers", "Hiring Teams"],
              "products.html": ["<h3>TraceScout</h3>", "<h3>Autopilot Social</h3>"],
              "releases/index.html": ["Hiring workspace", "Agency workspace", "Verification analytics"],
          }
          for path, phrases in required.items():
              text = Path(path).read_text(encoding="utf-8")
              for phrase in phrases:
                  if phrase not in text:
                      raise SystemExit(f"{path}: required phrase missing: {phrase}")
          PY

      - name: Sanity check changed HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in [Path('index.html'), Path('products.html'), Path('releases/index.html')]:
              t = f.read_text(encoding='utf-8')
              if '<html' not in t or '</html>' not in t or '<body' not in t or '</body>' not in t:
                  raise SystemExit(f'{f}: basic HTML document markers missing')
              print(f'{f}: {len(t):,} bytes, basic document markers present')
          PY
          git diff --check

      - name: Commit refreshed site and remove one time workflow
        shell: bash
        run: |
          rm .github/workflows/site-current-reality-refresh.yml
          git config user.name "PostaraTrend Site Refresh"
          git config user.email "admin@postaratrend.ca"
          git add index.html products.html releases/index.html .github/workflows/site-current-reality-refresh.yml
          git commit -m "Refresh site positioning for current products"
          git push origin HEAD:site-current-reality-2026-10-03
